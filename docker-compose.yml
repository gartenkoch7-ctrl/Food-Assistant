# Food-Assistant: server + PostgreSQL (ADR-0007). Guide: deploy/README.md
#   cp .env.example .env    # then set POSTGRES_PASSWORD and FOODASSISTANT_PUBLICURL
#   docker compose up -d --build
# HTTPS with Caddy: docker compose -f docker-compose.yml -f deploy/caddy/docker-compose.caddy.yml up -d
# All values below are examples; secrets only come from .env, never from this file.

name: food-assistant

services:
  server:
    build: .
    image: food-assistant:local
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      # Address under which phones and browsers reach the server. Required: without it the server
      # stops with a clear message (docker compose logs server). Set by the Caddy override.
      FOODASSISTANT__PUBLICURL: ${FOODASSISTANT_PUBLICURL:-}
      # Reverse proxies allowed to send X-Forwarded-For/-Proto: the Docker networks (172.16.0.0/12).
      # Safe because the server port is bound to 127.0.0.1; narrow it if you publish the port further.
      FOODASSISTANT__TRUSTEDPROXIES: ${FOODASSISTANT_TRUSTEDPROXIES:-172.16.0.0/12}
      # Data Protection key ring (sign-in cookies, encrypted secrets, token signing keys): keep this volume.
      FOODASSISTANT__DATAPROTECTIONPATH: /home/app/.aspnet/DataProtection-Keys
      ConnectionStrings__FoodAssistant: Host=db;Port=5432;Database=foodassistant;Username=foodassistant;Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      # Optional: send logs, traces and metrics to an OpenTelemetry collector. Empty = nothing leaves the server.
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
    ports:
      # Only reachable from this machine; outside access goes through HTTPS (Caddy or Tailscale).
      - "127.0.0.1:${FOODASSISTANT_PORT:-8080}:8080"
    volumes:
      - data-protection-keys:/home/app/.aspnet/DataProtection-Keys
      - backups:/backups
    healthcheck:
      # The runtime image has no curl; bash's /dev/tcp is enough for a plain HTTP check.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /health HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && head -n 1 <&3 | grep -q ' 200 '"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: foodassistant
      POSTGRES_USER: foodassistant
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      # For development (dotnet run against the container); only reachable from this machine.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U foodassistant -d foodassistant"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 5

volumes:
  db-data:
  data-protection-keys:
  backups:
